name: Release to npm

# Runs in the PUBLIC repo cometchat/cometchat-uikit-angular. The private repo's release workflow
# copies it here (scripts/release/stage-public.sh) — do not edit it in the public repo.
#
# A v* tag publishes @cometchat/chat-uikit-angular with npm trusted publishing (OIDC, no token)
# and provenance. Provenance needs a public source repository, which is why publishing happens
# here and not in the private repo (CI 5, ENG-40491). A release starts when a pull request merges
# into the private repo's master-v5, with no approval step (as iOS); the npm-production environment
# has no reviewers and only scopes the npm trusted publisher. Tests are not re-run: the commit
# already passed ci-gate and the full E2E privately.
#
# Tested = shipped (A3): the release commit's message records the digest of the package the
# private release built and checked ("npm package contents digest: sha256:…",
# scripts/ci/package-digest.sh). The build job rebuilds, refuses to go on unless its package has
# that digest, and hands exactly that tarball to the publish job.
#
# Only the publish job can get an npm token (id-token: write), and it installs and runs nothing
# from the repo: it downloads the checked tarball and publishes it. `npm ci` runs dependencies'
# install scripts, so it runs in the build job, which has no way to publish.
#
# The GitHub Release (A2): the private release's bot drafts it, with the release PR's description
# as the notes, right after the tag. Once npm has the package, github-release attaches the SBOM
# and publishes the draft. It is its own job so it can be re-run alone: re-running build fails
# once the version is on npm.
#
# Rehearsals (A6): the private release also copies this repo to the rehearsal repo
# cometchat/cometchat-uikit-angular-citest, as version <V>-citest.<run>. There everything runs
# except the real npm publish (`npm publish --dry-run`) and the smoke test of what npm serves.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and check the package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      node: ${{ steps.version.outputs.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Tag must match the version
        id: version
        run: |
          VERSION=$(node -p "require('./projects/cometchat-uikit/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $VERSION"; exit 1
          fi
          if npm view "@cometchat/chat-uikit-angular@$VERSION" version > /dev/null 2>&1; then
            echo "::error::$VERSION is already on npm; versions are never republished"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # The publish job checks nothing out, so it gets the same Node from here.
          echo "node=$(node -v)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npx ng build cometchat-uikit
      # Packed outside the package folder, so the tarball can't end up inside the package.
      - name: Pack; check the contents digest against the release commit
        id: pkg
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          npm pack ./dist/cometchat-uikit --pack-destination "$RUNNER_TEMP/release" > /dev/null
          tarball=$(ls "$RUNNER_TEMP"/release/*.tgz)
          digest=$(bash scripts/ci/package-digest.sh "$tarball")
          expected=$(git log -1 --format=%B HEAD | sed -n 's/^npm package contents digest: //p')
          if [ -z "$expected" ]; then
            echo "::error::The commit $GITHUB_REF_NAME points at records no package digest. Release tags are made only by the private repo's release."
            exit 1
          fi
          if [ "$digest" != "$expected" ]; then
            echo "::error::This build's package ($digest) is not the one the private release tested ($expected). Not publishing."
            exit 1
          fi
          echo "✓ package contents match the private release: $digest"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      # SBOM and licence check of what a customer installs (same script the private repo's
      # release runs).
      - name: SBOM and licence check
        env:
          TARBALL: ${{ steps.pkg.outputs.tarball }}
        run: bash scripts/ci/sbom-and-licenses.sh "$TARBALL" "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ steps.pkg.outputs.tarball }}
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/release/sbom.cdx.json
          retention-days: 30

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # npm's trusted publisher is tied to this environment, in the real repo only.
    environment: ${{ github.repository == 'cometchat/cometchat-uikit-angular' && 'npm-production' || '' }}
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      # No checkout and no install: only the tarball the build job checked.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.build.outputs.node }}
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      # A version with a pre-release suffix (5.3.0-beta.1) goes to the `next` dist-tag, never `latest`.
      - name: Publish with provenance
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tarball=$(ls "$RUNNER_TEMP"/package/*.tgz)
          TAG=latest
          case "$VERSION" in *-*) TAG=next ;; esac
          if [ "$GITHUB_REPOSITORY" = cometchat/cometchat-uikit-angular ]; then
            npm publish "$tarball" --provenance --access public --tag "$TAG"
          else
            echo "Rehearsal repo $GITHUB_REPOSITORY: dry run, nothing is published."
            npm publish "$tarball" --dry-run --access public --tag "$TAG"
          fi

  github-release:
    name: Publish the GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # attach the SBOM and publish the bot's draft Release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom
      - name: Attach the SBOM and publish the draft Release
        run: |
          # The draft is made seconds after the tag that started this run; allow for a slow API.
          for _ in $(seq 1 30); do
            draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null) && break
            sleep 10
          done
          if [ -z "${draft:-}" ]; then
            echo "::error::There is no Release for $TAG. The private repo's release drafts it: re-run its failed jobs, then re-run this job."
            exit 1
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/sbom/sbom.cdx.json" --clobber
          if [ "$draft" = true ]; then gh release edit "$TAG" --draft=false; fi
          echo "Published: $(gh release view "$TAG" --json url --jq .url)"

  # ENG-40597: install the version npm now serves into a new Angular app and build it. If this
  # fails, the published package is broken for customers: deprecate it and release a fix.
  smoke-published:
    name: Smoke-test the published package
    needs: [build, publish]
    # A rehearsal publishes nothing.
    if: ${{ github.repository == 'cometchat/cometchat-uikit-angular' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Wait until npm serves the version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for _ in $(seq 1 30); do
            npm view "@cometchat/chat-uikit-angular@$VERSION" version > /dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "::error::$VERSION not visible on npm after 5 minutes"; exit 1
      - name: Install from npm into a new Angular 21 app and build
        run: bash scripts/ci/consumer-app.sh 21 default "@cometchat/chat-uikit-angular@${{ needs.build.outputs.version }}"
