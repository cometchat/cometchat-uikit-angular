<!--
  Saved marker for the message bubble's meta row — the filled counterpart to the
  outlined bookmark.svg the menus use. Outline is the action, solid is the state.

  Kept on its own 9x11 canvas rather than padded onto the shared 24x24 icon
  grid, the same as pin_indicator.svg beside it: this is masked into a small
  fixed box in the meta row, not into the 24x24 slot of a menu row, so the tight
  canvas is what makes it size to match the pin.

  Rendered as a CSS mask, so the fill below is ignored — the colour comes from
  the consuming rule, which is what lets the one asset be white on an outgoing
  bubble and grey on an incoming one.
-->
<svg width="9" height="11" viewBox="0 0 9 11" fill="none" xmlns="http://www.w3.org/2000/svg">
