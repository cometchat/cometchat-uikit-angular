<!--
  Filled pin — the solid counterpart to the outlined keep.svg.

  Used where the pin is a STATE MARKER rather than an action: the pinned row in
  the conversation list. Menus keep the outlined keep.svg, because there the pin
  labels a thing you can do, not a thing that is already true.

  Same glyph as pin_indicator.svg (the bubble meta-row marker), re-centred on the
  shared 24x24 icon canvas at an 18px height so it masks to the same optical size
  as keep.svg and every other icon. `fill` is inert under a mask.
-->
