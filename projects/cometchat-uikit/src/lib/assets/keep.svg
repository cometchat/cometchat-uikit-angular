<!--
  Pin. Used for the Pin message option, Pin conversation, and the Pinned
  messages entry in the chat header.

  The supplied artwork is a 12x20 outline pin. It is wrapped here rather than
  used as-is because every menu icon is masked into a 24x24 box with
  `mask-size: contain` — a 12x20 source would scale to the FULL 24px height and
  read noticeably larger than the icons beside it. The transform re-centres the
  glyph on a 24x24 canvas at an 18px height, which is what the rest of the set
  occupies. `fill` is inert under a mask; the colour comes from the theme token.
-->
