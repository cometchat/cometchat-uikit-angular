<div class="cometchat-dropdown">
  <button
    #dropdownButton
    class="cometchat-dropdown__button"
    [class.cometchat-dropdown__button--open]="dropdownVisible"
    (click)="onButtonClick()"
    [attr.aria-expanded]="dropdownVisible"
    aria-haspopup="listbox"
    [attr.aria-controls]="listboxId"
    [attr.aria-activedescendant]="activeDescendantId"
    [attr.aria-label]="ariaLabel || displayValue"
    type="button"
  >
    <span class="cometchat-dropdown__button-text">{{ displayValue }}</span>
    <span class="cometchat-dropdown__button-icon" [class.cometchat-dropdown__button-icon--open]="dropdownVisible" aria-hidden="true">
      ▼
    </span>
  </button>

  @if (dropdownVisible) {
    <ul
      [id]="listboxId"
      class="cometchat-dropdown__menu"
      role="listbox"
      [attr.aria-label]="ariaLabel ? ariaLabel + ' options' : 'Dropdown options'"
    >
      @for (option of options; track option; let i = $index) {
        <li
          [id]="getOptionId(i)"
          class="cometchat-dropdown__option"
          [class.cometchat-dropdown__option--selected]="isOptionSelected(option)"
          [class.cometchat-dropdown__option--focused]="isOptionFocused(i)"
          (click)="onOptionClick(option)"
          [attr.aria-selected]="isOptionSelected(option)"
          role="option"
          tabindex="-1"
        >
          {{ option }}
        </li>
      }
    </ul>
  }
</div>
