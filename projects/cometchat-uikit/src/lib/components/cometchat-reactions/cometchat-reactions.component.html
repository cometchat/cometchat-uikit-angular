<div
  class="cometchat-reactions"
  role="group"
  [attr.aria-label]="'accessibility_message_reactions' | translate">

  @for (reaction of visibleReactions(); track trackByReaction($index, reaction)) {
    <div class="cometchat-reactions-info-wrapper">
      <cometchat-popover
        [useParentContainer]="true"
        [showOnHover]="true"
        [debounceOnHover]="hoverDebounceTime"
        [placement]="Placement.top"
        [content]="reactionInfoContent"
        [showTooltip]="true"
        [contentStyle]="reactionInfoPopoverStyle">

        <button
          class="cometchat-reactions__reaction"
          [class.cometchat-reactions__reaction-you]="reaction.getReactedByMe()"
          type="button"
          [attr.aria-label]="getReactionAriaLabel(reaction)"
          [attr.aria-pressed]="reaction.getReactedByMe()"
          (click)="onPillClick(reaction)"
          (keydown)="onReactionKeyDown($event, reaction)">
          <span class="cometchat-reactions__reaction-emoji" aria-hidden="true">{{ reaction.getReaction() }}</span>
          <span class="cometchat-reactions__reaction-count" aria-hidden="true">{{ reaction.getCount() }}</span>
        </button>
      </cometchat-popover>

      <ng-template #reactionInfoContent>
        <div>
          <cometchat-reaction-info
            [message]="message"
            [reaction]="reaction.getReaction()">
          </cometchat-reaction-info>
        </div>
      </ng-template>
    </div>
  }

  @if (showReactionListPopover()) {
    <cometchat-popover
      #moreListPopover
      [disableBackgroundInteraction]="true"
      [useParentContainer]="true"
      [placement]="moreListPlacement()"
      [content]="moreListContent"
      [contentStyle]="reactionListPopoverStyle"
      (popoverOpened)="onMoreListPopoverOpened()"
      (popoverClosed)="onMoreListPopoverClosed()">

      <!-- While the list is open, `forceShowReactionList` keeps this mounted so
           removing a reaction cannot yank the popover out from under the user.
           Once the overflow reaches zero there is nothing left to count, so the
           chip collapses to an invisible anchor rather than announcing "+0" —
           it still has to exist for the open popover to position against. -->
      <button
        class="cometchat-reactions__more-reaction"
        [class.cometchat-reactions__more-reaction--empty]="moreCount() === 0"
        type="button"
        aria-haspopup="dialog"
        [attr.aria-hidden]="moreCount() === 0 ? 'true' : null"
        [attr.tabindex]="moreCount() === 0 ? -1 : null"
        [attr.aria-label]="'+' + moreCount() + ' ' + ('accessibility_more_reactions' | translate)"
        [attr.aria-expanded]="forceShowReactionList()"
        (click)="updateMoreListPlacement()"
        (keydown)="onMoreReactionsKeyDown($event)">
        @if (moreCount() > 0) {
          <span class="cometchat-reactions__more-reaction-count" aria-hidden="true">+{{ moreCount() }}</span>
        }
      </button>
    </cometchat-popover>

    <ng-template #moreListContent>
      <div>
        <cometchat-reaction-list
          [message]="message"
          [reactionsRequestBuilder]="reactionsRequestBuilder"
          (itemClick)="onListItemClick($event)"
          (empty)="onReactionListEmpty()">
        </cometchat-reaction-list>
      </div>
    </ng-template>
  }
</div>
