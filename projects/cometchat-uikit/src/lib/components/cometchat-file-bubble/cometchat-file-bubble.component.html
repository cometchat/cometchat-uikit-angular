<!-- File Bubble Component Template -->
<div 
  class="cometchat-file-bubble"
  [class.cometchat-file-bubble--sender]="alignment === MessageBubbleAlignment.right"
  [class.cometchat-file-bubble--receiver]="alignment === MessageBubbleAlignment.left"
  [class.cometchat-file-bubble--expanded]="isExpanded">
  
  <!-- File Container. Multiple files get a grouping background, as in the React kit. -->
  <div
    class="cometchat-file-bubble__container"
    [class.cometchat-file-bubble__container--multi]="attachments.length > 1">

    <!-- Up to COLLAPSED_MAX (3) files; all of them once expanded. -->
    <div
      *ngFor="let attachment of visibleAttachments; trackBy: trackByAttachment"
      class="cometchat-file-bubble__file-item"
      [attr.aria-label]="getFileAriaLabel(attachment)">
      <img
        [src]="getFileIcon(getFileType(attachment))"
        class="cometchat-file-bubble__icon"
        [alt]="'file_bubble_file_icon' | translate"
        aria-hidden="true" />

      <div class="cometchat-file-bubble__metadata" aria-hidden="true">
        <span class="cometchat-file-bubble__filename">
          {{ attachment.name }}
        </span>
        <span class="cometchat-file-bubble__filesize">
          {{ getFileMeta(attachment) }}
        </span>
      </div>

      <button
        *ngIf="attachment.url"
        type="button"
        class="cometchat-file-bubble__download"
        [attr.aria-label]="getDownloadAriaLabel(attachment.name)"
        (click)="initiateDownload(attachment)"
        (keydown)="onDownloadKeyDown($event, attachment)">
        <div
          class="cometchat-file-bubble__download-icon"
          aria-hidden="true"></div>
      </button>
      <span
        *ngIf="!attachment.url"
        class="cometchat-file-bubble__download cometchat-file-bubble__download--disabled"
        [attr.aria-label]="'file_bubble_download_unavailable' | translate"
        [attr.title]="'file_bubble_download_unavailable' | translate">
        <div
          class="cometchat-file-bubble__download-icon cometchat-file-bubble__download-icon--disabled"
          aria-hidden="true"></div>
      </span>
    </div>

    <!-- "Show N more" (collapsed) -->
    <button
      *ngIf="hasOverflow && !isExpanded"
      class="cometchat-file-bubble__expand-indicator"
      (click)="toggleExpanded()"
      (keydown.enter)="toggleExpanded()"
      (keydown.space)="toggleExpanded(); $event.preventDefault()"
      tabindex="0"
      [attr.aria-label]="getExpandAriaLabel()"
      [attr.aria-expanded]="false">
      <span
        class="cometchat-file-bubble__toggle-icon"
        aria-hidden="true"
        [style.-webkit-mask-image]="'url(' + expandIconUrl + ')'"
        [style.mask-image]="'url(' + expandIconUrl + ')'"></span>
      {{ getShowMoreLabel() }}
    </button>

    <!-- "Show less" (expanded) -->
    <button
      #collapseButton
      *ngIf="hasOverflow && isExpanded"
      class="cometchat-file-bubble__collapse-control"
      (click)="toggleExpanded()"
      (keydown.enter)="toggleExpanded()"
      (keydown.space)="toggleExpanded(); $event.preventDefault()"
      tabindex="0"
      [attr.aria-label]="'file_bubble_show_less' | translate"
      [attr.aria-expanded]="true">
      <span
        class="cometchat-file-bubble__toggle-icon"
        aria-hidden="true"
        [style.-webkit-mask-image]="'url(' + collapseIconUrl + ')'"
        [style.mask-image]="'url(' + collapseIconUrl + ')'"></span>
      {{ 'file_bubble_show_less' | translate }}
    </button>
  </div>
  
  <!-- Caption Rendering -->
  <div 
    *ngIf="hasCaption"
    class="cometchat-file-bubble__caption">
    <cometchat-text-bubble
      [message]="$any(message)"
      [alignment]="alignment"
      [textFormatters]="textFormatters">
    </cometchat-text-bubble>
  </div>
</div>
