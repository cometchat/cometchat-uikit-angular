<div class="cometchat-tabs" role="tablist" aria-label="Navigation tabs">
  @for (tab of tabs; track tab.id; let i = $index) {
    <button
      class="cometchat-tabs__tab"
      [class.cometchat-tabs__tab--active]="activeTab() === tab.id"
      role="tab"
      [attr.aria-selected]="activeTab() === tab.id"
      [attr.tabindex]="activeTab() === tab.id ? 0 : -1"
      [id]="'tab-' + tab.id"
      [attr.aria-controls]="'tabpanel-' + tab.id"
      (click)="selectTab(tab)"
      (keydown)="onKeydown($event, i)"
    >
      <span
        class="cometchat-tabs__tab-icon"
        [style.-webkit-mask-image]="tab.iconDataUri"
        [style.mask-image]="tab.iconDataUri"
        aria-hidden="true"
      ></span>
      <span class="cometchat-tabs__tab-text">{{ getLabel(tab) }}</span>
    </button>
  }
</div>
