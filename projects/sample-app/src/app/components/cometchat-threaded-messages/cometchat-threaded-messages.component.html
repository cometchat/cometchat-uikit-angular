@if (parentMessage(); as message) {
  <div class="cometchat-threaded-messages">
    <!-- Thread Header (UIKit component) -->
    <cometchat-thread-header
      [parentMessage]="message"
      (backClick)="onBackClick()"
    ></cometchat-thread-header>

    <!-- Thread Message List. Takes the whole parent message, not just its id:
         the list scopes off the derived id, and reads the thread's subscription
         state off the object so a realtime reply can inherit it. -->
    <div class="cometchat-threaded-messages__list">
      <cometchat-message-list
        [parentMessage]="message"
        [goToMessageId]="goToMessageId()"
        [hideReplyInThreadOption]="true"
      ></cometchat-message-list>
    </div>

    <!-- Thread Message Composer -->
    @if (showComposer()) {
      <div class="cometchat-threaded-messages__composer">
        <cometchat-message-composer
          [parentMessageId]="parentMessageId()"
          [layout]="'multiline'"
          [enableRichText]="true"
          [hideRichTextToolbar]="true"
        ></cometchat-message-composer>
      </div>
    } @else {
      <div class="cometchat-threaded-messages__blocked-banner">
        <div class="cometchat-threaded-messages__blocked-banner-text">
          {{ 'cannot_send_to_blocked_user' | translate }}
          <a class="cometchat-threaded-messages__blocked-banner-link" (click)="onUnblockUser()">{{ 'click_to_unblock' | translate }}</a>
        </div>
      </div>
    }
  </div>
}
