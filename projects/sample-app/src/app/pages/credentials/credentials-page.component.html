<main [attr.aria-label]="'credentials_main_label' | translate" id="main-content" tabindex="-1" class="cometchat-credentials__page">
  <div class="cometchat-credentials__logo">
    <img src="assets/cometchat_logo.svg" alt="CometChat" />
  </div>

  <div class="cometchat-credentials__container">
    <div class="cometchat-credentials__header">
      <div class="cometchat-credentials__title">App Credentials</div>
    </div>

    <form class="cometchat-credentials__form" (ngSubmit)="saveCredentials()">
      <div class="cometchat-credentials__form-group">
        <div class="cometchat-credentials__form-label">Region</div>
        <div class="cometchat-credentials__region-wrapper" role="radiogroup" aria-label="Region">
          @for (r of regions; track r.value) {
            <div
              class="cometchat-credentials__region"
              [class.cometchat-credentials__region--selected]="region === r.value"
              role="radio"
              tabindex="0"
              [attr.aria-checked]="region === r.value"
              (click)="region = r.value"
              (keydown.enter)="region = r.value"
              (keydown.space)="region = r.value; $event.preventDefault()"
            >
              <span class="cometchat-credentials__region-flag" aria-hidden="true">{{ r.flag }}</span>
              <div class="cometchat-credentials__region-text">{{ r.label }}</div>
            </div>
          }
        </div>
      </div>

      <div class="cometchat-credentials__form-group">
        <label class="cometchat-credentials__form-label" for="appId">APP ID</label>
        <input
          id="appId"
          type="text"
          class="cometchat-credentials__form-input"
          placeholder="Enter the app ID"
          [(ngModel)]="appId"
          name="appId"
          autocomplete="off"
          required
        />
      </div>

      <div class="cometchat-credentials__form-group">
        <label class="cometchat-credentials__form-label" for="authKey">Auth Keys</label>
        <input
          id="authKey"
          type="text"
          class="cometchat-credentials__form-input"
          placeholder="Enter the auth key"
          [(ngModel)]="authKey"
          name="authKey"
          autocomplete="off"
          required
        />
      </div>

      @if (errorMessage()) {
        <div class="cometchat-credentials__error" role="alert">{{ errorMessage() }}</div>
      }

      <button type="submit" class="cometchat-credentials__button">
        Continue
      </button>
    </form>
  </div>
</main>
