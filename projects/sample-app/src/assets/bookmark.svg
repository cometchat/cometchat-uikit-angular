<!--
  Bookmark, outlined — Save message.

  Used for the Save action in the Organise submenu and for "Saved messages" in
  the chat-header menu. The filled counterpart lives in bookmark_filled.svg and
  marks a message that IS saved; outline is the action, solid is the state, the
  same split as keep.svg / keep_filled.svg.

  The supplied artwork is 14x17. It is wrapped rather than used as-is because
  menu icons mask into a 24x24 box with `mask-size: contain` — a 14x17 source
  would scale to the FULL 24px height and read larger than its neighbours. The
  transform re-centres it at the 18px glyph height the rest of the set occupies.
  `fill` is inert under a mask; the colour comes from the theme token.
-->
