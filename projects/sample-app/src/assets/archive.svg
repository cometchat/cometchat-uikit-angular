<!--
  Organise. Used for the "Organise" group in the message action sheet, whose
  children are Pin/Unpin and Save/Unsave.

  The supplied artwork is a 17x19 clipboard-with-lines glyph. It is wrapped here
  rather than used as-is because every menu icon is masked into a 24x24 box with
  `mask-size: contain` — a 17x19 source would scale to the FULL 24px height and
  read noticeably larger than the icons beside it. The transform re-centres the
  glyph on a 24x24 canvas at an 18px height (19 * 0.9474), which is what the rest
  of the set occupies. `fill` is inert under a mask; the colour comes from the
  theme token.
-->
