<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CometChat Sample App</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6852D6">
  <meta name="description" content="CometChat Angular V5 UIKit Sample Application">

  <!-- Preconnect to CometChat API domains for faster SDK initialization -->
  <link rel="preconnect" href="https://api.cometchat.com" crossorigin>
  <link rel="preconnect" href="https://assets.cometchat.io" crossorigin>
  <!-- Sample-data CDN, on the initial-load critical path (sampledata.json) -->
  <link rel="preconnect" href="https://assets.cc-cluster-2.io" crossorigin>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Prevent FOUC: inline critical CSS for app-root placeholder + splash -->
  <style>
    html, body { height: 100%; margin: 0; padding: 0; background: #fff; }
    app-root { display: block; height: 100%; }
    /* Splash paints from the initial HTML (fast FCP) and is aria-hidden so it
       is invisible to the accessibility tree. Angular replaces app-root's
       content on first render, removing it before audits snapshot the DOM. */
    .app-splash {
      display: flex; align-items: center; justify-content: center;
      height: 100%; background: #fff;
    }
    .app-splash__spinner {
      width: 40px; height: 40px;
      border: 4px solid #e4e2f5; border-top-color: #6852D6;
      border-radius: 50%; animation: app-splash-spin 0.8s linear infinite;
    }
    @keyframes app-splash-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .app-splash__spinner { animation: none; } }
  </style>
</head>
<body>
  <app-root>
    <div class="app-splash" aria-hidden="true">
      <div class="app-splash__spinner"></div>
    </div>
  </app-root>
</body>
</html>
